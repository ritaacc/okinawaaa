<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩行程 10/15–10/18</title>
<style>
:root{--bg:#E6F1F8;--card:#FFFFFF;--ink:#0F2A3D;--mute:#55738A;--sea:#0B4D7A;--pink:#0F77B8;--ontag:#fff;--line:#BCD6E8;--chip:#D3E7F4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1C2B;--card:#112C42;--ink:#E4F1FA;--mute:#8FB0C8;--sea:#7EC4F0;--pink:#5FB3E8;--ontag:#0A1C2B;--line:#24465F;--chip:#1A3A55}}
:root[data-theme="dark"]{--bg:#0A1C2B;--card:#112C42;--ink:#E4F1FA;--mute:#8FB0C8;--sea:#7EC4F0;--pink:#5FB3E8;--ontag:#0A1C2B;--line:#24465F;--chip:#1A3A55}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;max-width:560px;margin-inline:auto}
header{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:26px;letter-spacing:.04em;color:var(--sea)}
#ed{border:1px solid var(--sea);background:none;color:var(--sea);border-radius:14px;padding:6px 14px;font:inherit;cursor:pointer}
#ed.on{background:var(--pink);border-color:var(--pink);color:var(--ontag)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 12px;font:inherit;line-height:1.2;text-align:center;cursor:pointer}
nav button b{display:block;font-size:17px}
nav button span{font-size:12px;color:var(--mute)}
nav button[aria-selected=true]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
nav button[aria-selected=true] span{color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
main{padding:16px}
h2{margin:0 0 4px;font-size:21px}
.meta{font-size:14px;color:var(--mute);margin:0 0 2px}
ol{list-style:none;margin:16px 0 0;padding:0}
li.s{position:relative;padding-left:40px;padding-bottom:6px}
li.s::before{content:"";position:absolute;left:13px;top:30px;bottom:-4px;border-left:2px dashed var(--line)}
li.s:last-child::before{display:none}
.n{position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--sea);color:var(--bg);font-weight:700;text-align:center;line-height:28px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card h3{margin:0;font-size:17px}
.tag{display:inline-block;background:var(--pink);color:var(--ontag);border-radius:8px;padding:0 8px;font-size:13px;margin-top:4px}
.note{margin:4px 0 0;font-size:14px;color:var(--mute)}
.row{margin:6px 0 0;font-size:15px}
.row i{font-style:normal;margin-right:4px}
.map{display:inline-block;margin-top:6px;font-size:13px;color:var(--sea)}
.th{display:block;width:84px;height:84px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);margin-top:8px;cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 52px) 8px calc(env(safe-area-inset-bottom,0px) + 16px)}
#lb[hidden]{display:none}
#lb img{display:block;width:100%;max-width:640px;margin:0 auto;border-radius:6px}
#lbx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#222;font-size:20px;cursor:pointer}
.mv{margin:6px 0 8px;font-size:14px;color:var(--mute)}
.mv span{background:var(--chip);border-radius:10px;padding:2px 10px}
h4{margin:22px 0 0;font-size:16px;color:var(--sea)}
label{display:block;font-size:12px;color:var(--mute);margin-top:6px}
input{display:block;width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:2px}
.bar{display:flex;gap:6px;margin-top:8px}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.b.add{margin-top:10px;border-style:dashed;color:var(--sea);width:100%;padding:8px}
.b.del{color:var(--pink);margin-left:auto}
</style>
</head>

{n:"古宇利島",note:"心型岩",hr:"各店營業時間點地圖查看",eat:["下午茶 蝦蝦飯"]},
{n:"晚餐 大家 阿古豬",res:"已訂位 18:00・10人",im:"ufuya",hr:"點地圖查看",eat:["阿古豬"],buy:["甜點要買"]}]},
{d:"10/18",w:"日",h:"10/18（日）",t:"自由日・一心壽喜燒",stay:"換住 HOTEL ANTEROOM NAHA",s:[
{n:"想吃什麼就吃"},
{n:"想逛什麼就逛"},

{n:"還車 美栄橋站前 外語櫃檯",res:"還車 17:00",note:"跟取車是同一個地點",m:"美栄橋駅"}]},
{d:"備選",w:"還可以去哪裡",h:"備選",t:"還可以去哪裡",nn:1,s:[
{ic:"💡",n:"鐘乳洞 CAVE OKINAWA",hr:"點地圖查看"},
{ic:"💡",n:"萬座毛",hr:"點地圖查看"},

{ic:"💡",n:"Panza 溜索",hr:"點地圖查看"},
{ic:"💡",n:"燒肉蛋飯糰",note:"想吃（店家未定）"},
{ic:"💡",n:"漢堡",note:"想吃（店家未定）"},
{ic:"💡",n:"鹽巴冰淇淋",note:"想吃（店家未定）"},
{ic:"💡",n:"沖繩餅乾",note:"想買"},

{ic:"💡",n:"在地超市",note:"想買"}]}
];
var ORIG=JSON.stringify(D),edit=false,cur=0,rs=false,DB=null;
try{var L=localStorage.getItem("okv4");if(L)D=JSON.parse(L)}catch(e){}
function fill(){var o=JSON.parse(ORIG);D.forEach(function(p,a){["s","x"].forEach(function(l){(p[l]||[]).forEach(function(s){((o[a]||{})[l]||[]).forEach(function(t){if(t.n!==s.n)return;if(s.hr===undefined&&t.hr)s.hr=t.hr;if(s.im===undefined&&t.im)s.im=t.im})})})})}
try{fill()}catch(e){}
var tabs=document.getElementById("tabs"),panel=document.getElementById("panel"),ed=document.getElementById("ed");
function E(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function sp(v){return v.split(/[、,，]/).map(function(x){return x.trim()}).filter(Boolean)}
function q(s){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((s.m||s.n.replace(/^(午餐|晚餐|早午餐|下午茶)\s*/,""))+" 沖繩")}
function save(){
 var j=JSON.stringify(D);
 try{localStorage.setItem("okv4",j)}catch(e){}
 if(DB)try{DB.doc("trip4/data").set({json:j}).catch(function(){})}catch(e){}
}
function fld(lb,f,v,l,i){return '<label>'+lb+'<input data-l="'+l+'" data-i="'+i+'" data-f="'+f+'" value="'+E(v)+'"></label>'}
function view(s){
 var h='<div class="card"><h3>'+E(s.n)+'</h3>';
 if(s.res)h+='<span class="tag">'+E(s.res)+'</span>';
 if(s.note)h+='<p class="note">'+E(s.note)+'</p>';
 if(s.hr)h+='<p class="row"><i>🕒</i>'+E(s.hr)+'</p>';
 if(s.eat&&s.eat.length)h+='<p class="row"><i>🍴</i>'+E(s.eat.join('、'))+'</p>';
 if(s.buy&&s.buy.length)h+='<p class="row"><i>🛍️</i>'+E(s.buy.join('、'))+'</p>';
 if(s.im&&IMG[s.im])h+='<img class="th" data-im="'+s.im+'" src="'+IMG[s.im]+'" alt="點擊放大：'+E(s.n)+'">';
 return h+'<a class="map" target="_blank" rel="noopener" href="'+q(s)+'">📍 地圖</a></div>'+(s.mv?'<div class="mv"><span>'+E(s.mv)+'</span></div>':'');
}
function form(s,l,i,n){
 var h='<div class="card">'+fld('名稱','n',s.n,l,i)+fld('標籤（例：已訂位 12:00）','res',s.res,l,i)+fld('備註','note',s.note,l,i)+fld('營業時間','hr',s.hr,l,i)
 +fld('要吃的（用、分開）','eat',(s.eat||[]).join('、'),l,i)+fld('可以買的（用、分開）','buy',(s.buy||[]).join('、'),l,i)
 +fld('到下一站的交通時間（例：🚗 20分）','mv',s.mv,l,i)+fld('地圖搜尋字（不填就用名稱）','m',s.m,l,i);
 h+='<div class="bar">';
 if(i>0)h+='<button class="b" data-a="up" data-l="'+l+'" data-i="'+i+'">↑</button>';
 if(i<n-1)h+='<button class="b" data-a="down" data-l="'+l+'" data-i="'+i+'">↓</button>';
 return h+'<button class="b del" data-a="del" data-l="'+l+'" data-i="'+i+'">刪除</button></div></div>';
}
function list(d,l){
 var a=d[l],h='<ol>';
 a.forEach(function(s,k){
  h+='<li class="s"><span class="n">'+(s.ic||(d.nn||l==="x"?'•':k+1))+'</span>'+(edit?form(s,l,k,a.length):view(s))+'</li>';
 });
 h+='</ol>';
 if(edit)h+='<button class="b add" data-a="add" data-l="'+l+'">＋ 新增</button>';
 return h;
}
function render(){
 var d=D[cur],h;
 if(edit){
  h=fld('標題','t',d.t,'p','')+(d.stay!=null?fld('住宿','stay',d.stay,'p',''):'')+(d.fl!=null?fld('航班','fl',d.fl,'p',''):'');
 }else{
  h='<h2>'+E(d.h)+' '+E(d.t)+'</h2>'+(d.stay?'<p class="meta">🛏️ '+E(d.stay)+'</p>':'')+(d.fl?'<p class="meta">'+E(d.fl)+'</p>':'');
 }
 h+=list(d,"s");
 if(d.x){h+='<h4>'+E(d.xh)+'</h4>'+list(d,"x")}
 if(edit)h+='<button class="b add" data-a="reset">'+(rs?'再按一次確認還原':'還原成原始行程')+'</button>';
 panel.innerHTML=h;
 Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute("aria-selected",j==cur)});
 ed.textContent=edit?"完成":"編輯";ed.className=edit?"on":"";
}
D.forEach(function(d,i){
 var b=document.createElement("button");b.setAttribute("role","tab");
 b.innerHTML='<b>'+E(d.d)+'</b><span>'+E(d.w)+'</span>';
 b.onclick=function(){cur=i;rs=false;render();window.scrollTo(0,0)};tabs.appendChild(b);
});
ed.onclick=function(){edit=!edit;rs=false;render()};
panel.addEventListener("change",function(e){
 var t=e.target,f=t.dataset.f;if(!f)return;
 if(t.dataset.l==="p")D[cur][f]=t.value;
 else D[cur][t.dataset.l][+t.dataset.i][f]=(f==="eat"||f==="buy")?sp(t.value):t.value;
 save();
});
panel.addEventListener("click",function(e){
 var th=e.target.closest("img.th");
 if(th){document.getElementById("lbi").src=IMG[th.dataset.im];document.getElementById("lb").hidden=false;document.getElementById("lb").scrollTop=0;return}
 var b=e.target.closest("button[data-a]");if(!b)return;
 var a=b.dataset.a,l=b.dataset.l,i=+b.dataset.i,arr=l?D[cur][l]:null;
 if(a==="reset"){
  if(!rs){rs=true;render();return}
  D=JSON.parse(ORIG);rs=false;
 }else if(a==="add")arr.push({n:"新項目"});
 else if(a==="del")arr.splice(i,1);
 else{var j=a==="up"?i-1:i+1,x=arr[i];arr[i]=arr[j];arr[j]=x}
 save();render();
});
document.getElementById("lb").onclick=function(){this.hidden=true};
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("lb").hidden=true});
render();
try{
 if(window.claude&&window.claude.use)window.claude.use("db").then(function(db){
  if(!db)return;DB=db;
  db.doc("trip4/data").get().then(function(s){
   if(s.exists&&!edit){try{D=JSON.parse(s.data().json);try{fill()}catch(e){}render()}catch(e){}}
  }).catch(function(){});
 }).catch(function(){});
}catch(e){}
</script>
</body>
